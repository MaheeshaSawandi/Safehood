name: safehood

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1


environment:
  sdk: ^3.12.2


dependencies:

  flutter:
    sdk: flutter


  # Icons
  cupertino_icons: ^1.0.8


  # Google Maps
  google_maps_flutter: ^2.12.3


  # GPS Location
  geolocator: ^14.0.2


  # Convert address <-> coordinates
  geocoding: ^4.0.0


  # Local Storage
  shared_preferences: ^2.5.3


  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1


  # Prediction Chart
  fl_chart: ^1.2.0


  # Feedback Rating
  flutter_rating_bar: ^4.0.1


  # Image Picker
  image_picker: ^1.1.2


  # Internet Connection Check
  connectivity_plus: ^6.1.3


  # Phone Calls
  url_launcher: ^6.3.1



dev_dependencies:

  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0



flutter:

  uses-material-design: true